{% extends "base.html" %}

{% block header_title %}<h1>Password <span class="neon-text">Analyzer</span></h1>{% endblock %}

{% block content %}
<div class="tool-container glass-card">
    <div class="tool-header">
        <i class="ph ph-password"></i>
        <h2>Cryptographic Password Evaluation</h2>
        <p>Enter a phrase to dynamically analyze entropy and structural strength.</p>
    </div>
    
    <div class="password-tester">
        <div class="input-group">
            <input type="text" id="password-input" class="cyber-input" placeholder="Enter password to scan...">
            <button id="toggle-pwd" class="btn btn-icon"><i class="ph ph-eye"></i></button>
        </div>
        
        <div class="strength-meter">
            <div class="strength-bar" id="strength-bar"></div>
        </div>
        <div class="strength-status">
            Strength Level: <span id="strength-text" class="neon-text">Awaiting Input...</span>
        </div>
        
        <ul class="suggestions-list" id="suggestions">
            <!-- JS will populate improvements -->
        </ul>
    </div>
</div>
{% endblock %}
